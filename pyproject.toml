[project]
name = "ai-eval-harness"
version = "0.1.0"
description = "AI output-evaluation harness with traceability reports"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "pytest",
    "jinja2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]